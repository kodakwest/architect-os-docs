---
name: "🔒 Security Issue"
description: "Report a security vulnerability or incident"
title: "[Security] <Brief description of the vulnerability>"
labels: ["🔒 Security", "🔴 Critical"]
body:
  - type: markdown
    attributes:
      value: |
        **For Security Related Items:**
        Report security vulnerabilities, incidents, or misconfigurations. Be concise and avoid exposing sensitive details in public fields.

  - type: input
    id: title
    attributes:
      label: Title
      description: Short, descriptive summary
      placeholder: e.g., "XSS vulnerability in login form"
    validations:
      required: false

  - type: input
    id: systems-impacted
    attributes:
      label: System(s) Impacted
      description: Which systems are affected
      placeholder: e.g., "VISIBILITY/API/Frontend"
    validations:
      required: false

  - type: dropdown
    id: type
    attributes:
      label: Type
      description: What type of security issue is this?
      options:
        - "Vulnerability"
        - "Incident"
        - "Misconfiguration"
        - "Policy Violation"
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Brief summary of the issue, affected asset, and how it was found
      placeholder: Describe the vulnerability and discovery method
    validations:
      required: false

  - type: textarea
    id: remediation-plan
    attributes:
      label: Remediation Plan
      description: What needs to be done?
      placeholder: e.g., patch, config change, code fix
    validations:
      required: false

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: CVSS or impact severity
      options:
        - "🔴 Critical - Immediate action required"
        - "🟡 High - Action required within 24-48 hours"
        - "🟢 Medium - Action required within 7 days"
        - "🔵 Low - Action required within 30 days"
    validations:
      required: false

  - type: textarea
    id: attachments
    attributes:
      label: Attachments / Links
      description: Scan reports, logs, related tickets
      placeholder: Link to or attach supporting documentation
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        **Guidelines:**
        - Do not use emojis in descriptions
        - Avoid line breaks and headers where possible
        - Avoid repetition and redundant information
        - Be concise - say more with less
        - Do not expose sensitive data in public fields
